<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wood Screw Unbolt Infinite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #120f0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 750px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: radial-gradient(circle, #2b221c 0%, #120d09 100%);
      box-shadow: 0 20px 40px rgba(0,0,0,0.9);
      border-radius: 16px;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }

    .level-badge {
      background: linear-gradient(135deg, #f39c12, #d35400);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .btn {
      background: #e67e22;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b33900;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b33900;
    }

    canvas {
      width: 100%;
      height: calc(100% - 75px);
      background: #2e241d;
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.6);
      border: 4px solid #4a3a2c;
    }

    .footer-text {
      font-size: 12px;
      color: #a09387;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="header">
      <div class="level-badge" id="levelDisplay">Level 1</div>
      <button class="btn" id="resetBtn">Restart</button>
    </div>

    <canvas id="gameCanvas" width="380" height="580"></canvas>
    
    <div class="footer-text">
      Unbolt all screws 🔩 to drop the wood planks!
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const levelDisplay = document.getElementById("levelDisplay");
    const resetBtn = document.getElementById("resetBtn");

    // Synthesized Audio System
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'select') {
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.07);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'place') {
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'fall') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.25);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.setValueAtTime(420, now + 0.08);
        osc.frequency.setValueAtTime(520, now + 0.16);
        osc.frequency.setValueAtTime(640, now + 0.24);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      }
    }

    // Colors for procedural planks
    const plankColors = [
      '#d35400', '#27ae60', '#2980b9', '#8e44ad', '#c0392b', '#16a085', '#f39c12'
    ];

    let currentLevel = 1;
    let selectedScrewIndex = -1;
    let isWinning = false;
    let gameData = { holes: [], screws: [], planks: [] };

    // Procedural Level Generator
    function generateLevel(levelNum) {
      currentLevel = levelNum;
      levelDisplay.innerText = `Level ${currentLevel}`;
      selectedScrewIndex = -1;
      isWinning = false;

      const holes = [];
      const screws = [];
      const planks = [];

      // Determine level difficulty parameters
      const cols = 4;
      const rows = 4 + Math.min(Math.floor(levelNum / 2), 2); 
      const plankCount = Math.min(2 + Math.floor(levelNum / 1.5), 6);
      
      const startX = 60;
      const startY = 120;
      const stepX = (canvas.width - 120) / (cols - 1);
      const stepY = 320 / (rows - 1);

      // 1. Generate Board Grid Holes
      let holeId = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          holes.push({
            id: holeId++,
            x: startX + c * stepX,
            y: startY + r * stepY
          });
        }
      }

      // Track occupied holes
      const occupiedHoles = new Set();

      // 2. Generate Random Planks
      for (let p = 0; p < plankCount; p++) {
        // Pick 2 distinct holes for this plank
        let idx1 = Math.floor(Math.random() * holes.length);
        let idx2 = Math.floor(Math.random() * holes.length);

        while (idx1 === idx2) {
          idx2 = Math.floor(Math.random() * holes.length);
        }

        const h1 = holes[idx1];
        const h2 = holes[idx2];
        const color = plankColors[p % plankColors.length];

        const dist = Math.hypot(h2.x - h1.x, h2.y - h1.y);
        const angle = Math.atan2(h2.y - h1.y, h2.x - h1.x);

        planks.push({
          id: p,
          color: color,
          length: dist + 50,
          width: 38,
          h1Idx: idx1,
          h2Idx: idx2,
          centerX: (h1.x + h2.x) / 2,
          centerY: (h1.y + h2.y) / 2,
          angle: angle,
          vy: 0,
          rotationVel: 0,
          dropped: false
        });

        // Place screws in holes holding this plank
        if (!occupiedHoles.has(idx1)) {
          screws.push({ holeIndex: idx1 });
          occupiedHoles.add(idx1);
        }
        if (!occupiedHoles.has(idx2)) {
          screws.push({ holeIndex: idx2 });
          occupiedHoles.add(idx2);
        }
      }

      // Ensure at least 2 free empty holes exist to allow moving screws
      while (holes.length - occupiedHoles.size < 2) {
        // Remove a random screw if overcrowding occurs
        if (screws.length > 2) {
          const removed = screws.pop();
          occupiedHoles.delete(removed.holeIndex);
        } else {
          break;
        }
      }

      gameData = { holes, screws, planks };
    }

    // Physics Engine Update
    function updatePhysics() {
      let activePlanks = gameData.planks.filter(p => !p.dropped);

      activePlanks.forEach(plank => {
        // Check remaining screws holding this plank
        let h1Screw = gameData.screws.find(s => s.holeIndex === plank.h1Idx);
        let h2Screw = gameData.screws.find(s => s.holeIndex === plank.h2Idx);

        if (!h1Screw && !h2Screw) {
          // Both screws gone -> Plank falls down
          plank.vy += 0.8;
          plank.centerY += plank.vy;
          plank.angle += 0.05;

          if (plank.centerY > canvas.height + 200) {
            plank.dropped = true;
            playSound('fall');
          }
        }
      });

      // Win Condition Check
      if (gameData.planks.length > 0 && gameData.planks.every(p => p.dropped) && !isWinning) {
        isWinning = true;
        playSound('win');
        setTimeout(() => {
          alert(`🎉 Level ${currentLevel} Cleared!`);
          generateLevel(currentLevel + 1);
        }, 300);
      }
    }

    // Render Canvas
    function draw() {
      // Background Wood Pattern
      ctx.fillStyle = "#2e241d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Wood Grain Detail Lines
      ctx.strokeStyle = "#251c16";
      ctx.lineWidth = 2;
      for (let i = 0; i < canvas.height; i += 22) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // 1. Draw Holes on Board
      gameData.holes.forEach(hole => {
        ctx.fillStyle = "#15100c";
        ctx.beginPath();
        ctx.arc(hole.x, hole.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#3f3024";
        ctx.lineWidth = 3;
        ctx.stroke();
      });

      // 2. Draw Wooden Planks
      gameData.planks.forEach(plank => {
        if (plank.dropped) return;

        ctx.save();
        ctx.translate(plank.centerX, plank.centerY);
        ctx.rotate(plank.angle);

        // Plank Shadow
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(-plank.length / 2 + 4, -plank.width / 2 + 6, plank.length, plank.width);

        // Plank Wood
        ctx.fillStyle = plank.color;
        ctx.beginPath();
        ctx.roundRect(-plank.length / 2, -plank.width / 2, plank.length, plank.width, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.4)";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Plank Screw Hole Cutouts
        const h1 = gameData.holes[plank.h1Idx];
        const h2 = gameData.holes[plank.h2Idx];

        // Local coordinates for holes
        const localH1X = (h1.x - plank.centerX) * Math.cos(-plank.angle) - (h1.y - plank.centerY) * Math.sin(-plank.angle);
        const localH1Y = (h1.x - plank.centerX) * Math.sin(-plank.angle) + (h1.y - plank.centerY) * Math.cos(-plank.angle);
        const localH2X = (h2.x - plank.centerX) * Math.cos(-plank.angle) - (h2.y - plank.centerY) * Math.sin(-plank.angle);
        const localH2Y = (h2.x - plank.centerX) * Math.sin(-plank.angle) + (h2.y - plank.centerY) * Math.cos(-plank.angle);

        ctx.fillStyle = "#1e1813";
        ctx.beginPath();
        ctx.arc(localH1X, localH1Y, 14, 0, Math.PI * 2);
        ctx.arc(localH2X, localH2Y, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      // 3. Draw Metallic Screws
      gameData.screws.forEach((screw, idx) => {
        let hole = gameData.holes[screw.holeIndex];
        let isSelected = (idx === selectedScrewIndex);

        ctx.save();
        ctx.translate(hole.x, hole.y - (isSelected ? 8 : 0));

        // Outer Metallic Ring
        ctx.fillStyle = isSelected ? "#f1c40f" : "#d1d5db";
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#6b7280";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Screw Thread Inner
        ctx.fillStyle = "#9ca3af";
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();

        // Cross Slot (+)
        ctx.strokeStyle = "#1f2937";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-5, -5);
        ctx.lineTo(5, 5);
        ctx.moveTo(5, -5);
        ctx.lineTo(-5, 5);
        ctx.stroke();

        ctx.restore();
      });
    }

    // Input Logic
    function handleTap(clientX, clientY) {
      initAudio();

      const rect = canvas.getBoundingClientRect();
      const tapX = (clientX - rect.left) * (canvas.width / rect.width);
      const tapY = (clientY - rect.top) * (canvas.height / rect.height);

      // Check if tapped a screw
      for (let i = 0; i < gameData.screws.length; i++) {
        let hole = gameData.holes[gameData.screws[i].holeIndex];
        let dist = Math.hypot(tapX - hole.x, tapY - hole.y);

        if (dist < 24) {
          selectedScrewIndex = (selectedScrewIndex === i) ? -1 : i;
          playSound('select');
          return;
        }
      }

      // Move screw to empty hole
      if (selectedScrewIndex !== -1) {
        for (let hIdx = 0; hIdx < gameData.holes.length; hIdx++) {
          let hole = gameData.holes[hIdx];
          let dist = Math.hypot(tapX - hole.x, tapY - hole.y);

          if (dist < 24) {
            let isOccupied = gameData.screws.some(s => s.holeIndex === hIdx);

            if (!isOccupied) {
              gameData.screws[selectedScrewIndex].holeIndex = hIdx;
              selectedScrewIndex = -1;
              playSound('place');
              return;
            }
          }
        }
      }
    }

    // Event Listeners (Mobile & Desktop)
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      handleTap(e.clientX, e.clientY);
    });

    resetBtn.addEventListener("click", () => {
      generateLevel(currentLevel);
    });

    // Main Game Loop
    function gameLoop() {
      updatePhysics();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Start Level 1
    generateLevel(1);
    gameLoop();
  </script>
</body>
</html>
