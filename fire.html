<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Mini Free Fire - Mobile & PC FPS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050b14;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0, 255, 204, 0.9);
      box-shadow: 0 0 6px rgba(0, 255, 204, 0.8);
      transition: background 0.1s ease, transform 0.1s ease;
    }
    #crosshair::before {
      top: 5px; left: -10px; width: 32px; height: 2px;
    }
    #crosshair::after {
      top: -10px; left: 5px; width: 2px; height: 32px;
    }
    #crosshair-dot {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 4px;
      height: 4px;
      background: #ff0055;
      border-radius: 50%;
    }

    /* Crosshair Hit Marker Animation */
    #crosshair.hit::before, #crosshair.hit::after {
      background: #ff0055;
      box-shadow: 0 0 10px #ff0055;
      transform: scale(1.3);
    }

    /* Top HUD Bar */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-weight: 700;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .health-bar-container {
      width: 140px;
      height: 14px;
      background: rgba(255, 0, 0, 0.25);
      border: 1.5px solid #00ffcc;
      border-radius: 8px;
      overflow: hidden;
    }
    #healthFill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ffcc);
      transition: width 0.2s ease;
    }

    /* Mobile Controls Overlay */
    #mobileControls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      display: none; /* Auto shown if touch detected */
    }

    /* Touch Joystick Area (Left side) */
    #joystickZone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(0, 255, 204, 0.4);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    #joystickKnob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      margin-top: -25px;
      margin-left: -25px;
      background: radial-gradient(circle, #00ffcc 0%, #0284c7 100%);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
      pointer-events: none;
      transform: translate(0px, 0px);
    }

    /* Touch Aim Zone (Right screen drag area) */
    #aimTouchZone {
      position: absolute;
      top: 0;
      right: 0;
      width: 60%;
      height: 100%;
      pointer-events: auto;
      touch-action: none;
    }

    /* Mobile Action Buttons (Right side) */
    #mobileButtons {
      position: absolute;
      bottom: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .touch-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #00ffcc;
      color: #00ffcc;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
      touch-action: manipulation;
    }
    .touch-btn:active {
      transform: scale(0.92);
    }

    #fireBtn {
      width: 85px;
      height: 85px;
      background: radial-gradient(circle, #ff0055 0%, #990033 100%);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }

    /* Blocker / Menu Screen */
    #blocker {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(5, 11, 20, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    #instructions {
      width: 88%;
      max-width: 460px;
      padding: 28px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00ffcc;
      border-radius: 20px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
    }

    #instructions h1 {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #00ffcc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    #instructions p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 22px;
    }

    .start-btn {
      background: linear-gradient(135deg, #00ffcc, #0284c7);
      color: #050b14;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:active {
      transform: scale(0.95);
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Tone.js CDN for Sound Effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

  <!-- Crosshair -->
  <div id="crosshair"><div id="crosshair-dot"></div></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-card">
      <span>HEALTH</span>
      <div class="health-bar-container">
        <div id="healthFill"></div>
      </div>
    </div>
    <div class="hud-card">
      <span>AMMO:</span>
      <span id="ammoVal" style="color:#00ffcc;">30 / ∞</span>
    </div>
    <div class="hud-card">
      <span>SCORE:</span>
      <span id="scoreVal" style="color:#ff0055;">0</span>
    </div>
  </div>

  <!-- Mobile Touch Controls -->
  <div id="mobileControls">
    <!-- Touch Aiming Zone -->
    <div id="aimTouchZone"></div>

    <!-- Joystick Zone -->
    <div id="joystickZone">
      <div id="joystickKnob"></div>
    </div>

    <!-- Mobile Action Buttons -->
    <div id="mobileButtons">
      <div class="touch-btn" id="reloadBtn">RELOAD</div>
      <div class="touch-btn" id="fireBtn">🔥 FIRE</div>
    </div>
  </div>

  <!-- Start / Pause / Game Over Modal -->
  <div id="blocker">
    <div id="instructions">
      <h1 id="titleText">🎮 MINI FREE FIRE 3D</h1>
      <p id="descText">
        <b>Rule:</b> Each enemy takes <b>EXACTLY 7 HITS</b> to kill!<br><br>
        <b>PC Controls:</b> WASD to Move | Mouse to Aim | Left Click to Shoot | R to Reload<br><br>
        <b>Mobile Controls:</b> Left Joystick to Move | Right Drag to Aim | Touch Fire & Reload
      </p>
      <button class="start-btn" id="startBtn">START BATTLE</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    
    let health = 100;
    let score = 0;
    let ammo = 30;
    let isGameOver = false;

    let enemies = [];
    let bullets = [];
    let particles = [];
    let floatingTexts = [];

    // Touch / Joystick State
    let isTouchDevice = false;
    let joystickActive = false;
    let joystickVector = { x: 0, y: 0 }; 
    let aimTouchId = null;
    let previousAimTouch = { x: 0, y: 0 };

    // Camera rotation tracking
    let pitch = 0; 
    let yaw = 0;   

    // DOM Elements
    const crosshairEl = document.getElementById('crosshair');
    const blocker = document.getElementById('blocker');
    const startBtn = document.getElementById('startBtn');
    const healthFill = document.getElementById('healthFill');
    const scoreVal = document.getElementById('scoreVal');
    const ammoVal = document.getElementById('ammoVal');
    const mobileControls = document.getElementById('mobileControls');
    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    const aimTouchZone = document.getElementById('aimTouchZone');
    const fireBtn = document.getElementById('fireBtn');
    const reloadBtn = document.getElementById('reloadBtn');

    // Synthesized Sound Effects via Tone.js
    let shootSynth, hitSynth, reloadSynth;
    function initAudio() {
      Tone.start();
      shootSynth = new Tone.NoiseSynth({
        noise: { type: 'white' },
        envelope: { attack: 0.005, decay: 0.08, sustain: 0 }
      }).toDestination();

      hitSynth = new Tone.MembraneSynth({
        pitchDecay: 0.05,
        octaves: 4,
        oscillator: { type: 'sine' },
        envelope: { attack: 0.001, decay: 0.1, sustain: 0 }
      }).toDestination();

      reloadSynth = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.15, sustain: 0 }
      }).toDestination();
    }

    function playGunshot() {
      if (shootSynth) shootSynth.triggerAttackRelease("16n");
    }

    function playHitSound() {
      if (hitSynth) hitSynth.triggerAttackRelease("C3", "8n");
    }

    function playReloadSound() {
      if (reloadSynth) {
        reloadSynth.triggerAttackRelease("G4", "16n");
        setTimeout(() => reloadSynth.triggerAttackRelease("C5", "16n"), 120);
      }
    }

    function checkTouchSupport() {
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        isTouchDevice = true;
        mobileControls.style.display = 'block';
      }
    }
    checkTouchSupport();

    let isLocked = false;

    startBtn.addEventListener('click', () => {
      initAudio();
      if (isGameOver) resetGame();

      if (!isTouchDevice) {
        document.body.requestPointerLock();
      } else {
        isLocked = true;
        blocker.style.display = 'none';
      }
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body) {
        isLocked = true;
        blocker.style.display = 'none';
      } else if (!isTouchDevice) {
        isLocked = false;
        if (!isGameOver) {
          document.getElementById('titleText').innerText = "GAME PAUSED";
          document.getElementById('descText').innerText = "Click to resume your battle.";
          startBtn.innerText = "RESUME";
          blocker.style.display = 'flex';
        }
      }
    });

    // Keyboard Listeners (PC) - WASD Strafe Logic (A = Left, D = Right)
    document.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
        case 'KeyR': reloadWeapon(); break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    });

    // Mouse Aim
    document.addEventListener('mousemove', (e) => {
      if (!isLocked || isTouchDevice) return;

      const sensitivity = 0.0022;
      yaw -= e.movementX * sensitivity;
      pitch -= e.movementY * sensitivity;

      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
    });

    // Mouse Firing
    document.addEventListener('mousedown', (e) => {
      if (isLocked && !isTouchDevice && e.button === 0) {
        shoot();
      }
    });

    joystickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      joystickActive = true;
      updateJoystick(e.touches[0]);
    }, { passive: false });

    joystickZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (joystickActive) {
        updateJoystick(e.touches[0]);
      }
    }, { passive: false });

    const stopJoystick = () => {
      joystickActive = false;
      joystickVector = { x: 0, y: 0 };
      joystickKnob.style.transform = `translate(0px, 0px)`;
    };

    joystickZone.addEventListener('touchend', stopJoystick);
    joystickZone.addEventListener('touchcancel', stopJoystick);

    function updateJoystick(touch) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;

      const maxRadius = rect.width / 2;
      const distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

      joystickVector.x = dx / maxRadius;  // Strafe: +1 Right, -1 Left
      joystickVector.y = -dy / maxRadius; // Forward: +1 Up, -1 Down
    }

    // Touch Aiming (Right Drag)
    aimTouchZone.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (aimTouchId === null) {
          aimTouchId = t.identifier;
          previousAimTouch = { x: t.clientX, y: t.clientY };
        }
      }
    }, { passive: true });

    aimTouchZone.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === aimTouchId) {
          const dx = t.clientX - previousAimTouch.x;
          const dy = t.clientY - previousAimTouch.y;

          const touchSens = 0.004;
          yaw -= dx * touchSens;
          pitch -= dy * touchSens;
          pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

          camera.rotation.set(pitch, yaw, 0, 'YXZ');
          previousAimTouch = { x: t.clientX, y: t.clientY };
        }
      }
    }, { passive: true });

    const stopAimTouch = (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === aimTouchId) {
          aimTouchId = null;
        }
      }
    };

    aimTouchZone.addEventListener('touchend', stopAimTouch);
    aimTouchZone.addEventListener('touchcancel', stopAimTouch);

    // Touch Buttons
    fireBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (isLocked) shoot();
    }, { passive: false });

    reloadBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      reloadWeapon();
    }, { passive: false });

    function reloadWeapon() {
      ammo = 30;
      ammoVal.innerText = `${ammo} / ∞`;
      playReloadSound();
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);
      scene.fog = new THREE.FogExp2(0x0a0f1d, 0.012);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.rotation.order = 'YXZ';
      camera.position.set(0, 1.6, 0);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(30, 50, 20);
      scene.add(dirLight);

      // Floor
      const floorGeo = new THREE.PlaneGeometry(160, 160);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Grid Pattern
      const grid = new THREE.GridHelper(160, 32, 0x00ffcc, 0x334155);
      grid.position.y = 0.02;
      scene.add(grid);

      // Crates / Cover Obstacles
      for (let i = 0; i < 28; i++) {
        const boxGeo = new THREE.BoxGeometry(3.5, 3.5, 3.5);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
        const box = new THREE.Mesh(boxGeo, boxMat);

        let rx = (Math.random() - 0.5) * 110;
        let rz = (Math.random() - 0.5) * 110;

        if (Math.hypot(rx, rz) < 12) {
          rx += 20;
          rz += 20;
        }

        box.position.set(rx, 1.75, rz);
        scene.add(box);
      }

      // WebGL Renderer Setup
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);

      // Enemy Spawner
      setInterval(spawnEnemy, 2200);
    }

    function shoot() {
      if (ammo <= 0) return;
      ammo--;
      ammoVal.innerText = `${ammo} / ∞`;
      playGunshot();

      const bulletGeo = new THREE.SphereGeometry(0.12, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);

      bullet.position.copy(camera.position);

      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);

      bullet.userData = { dir: dir, life: 55 };
      bullets.push(bullet);
      scene.add(bullet);
    }

    // Spawn Enemy Bot with EXACTLY 7 HP
    function spawnEnemy() {
      if (enemies.length >= 10 || !isLocked || isGameOver) return;

      const group = new THREE.Group();

      // Body Cylinder
      const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 2, 12);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.0;
      group.add(body);

      // Head Sphere
      const headGeo = new THREE.SphereGeometry(0.4, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2.2;
      group.add(head);

      // Spawn location at safe distance
      const angle = Math.random() * Math.PI * 2;
      const radius = 35 + Math.random() * 25;

      group.position.set(
        camera.position.x + Math.cos(angle) * radius,
        0,
        camera.position.z + Math.sin(angle) * radius
      );

      // EXACTLY 7 HITS REQUIRED TO ELIMINATE
      group.userData = { 
        hp: 7, 
        maxHp: 7, 
        bodyMesh: body,
        flashTimer: 0 
      };

      enemies.push(group);
      scene.add(group);
    }

    function triggerHitFeedback() {
      playHitSound();
      crosshairEl.classList.add('hit');
      setTimeout(() => crosshairEl.classList.remove('hit'), 120);
    }

    function createHitParticles(pos) {
      for (let i = 0; i < 8; i++) {
        const pGeo = new THREE.SphereGeometry(0.08, 4, 4);
        const pMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.copy(pos);
        p.userData = {
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 4,
            Math.random() * 4,
            (Math.random() - 0.5) * 4
          ),
          life: 20
        };
        particles.push(p);
        scene.add(p);
      }
    }

    function resetGame() {
      health = 100;
      score = 0;
      ammo = 30;
      isGameOver = false;

      healthFill.style.width = '100%';
      scoreVal.innerText = score;
      ammoVal.innerText = `${ammo} / ∞`;

      enemies.forEach(e => scene.remove(e));
      enemies = [];

      bullets.forEach(b => scene.remove(b));
      bullets = [];

      camera.position.set(0, 1.6, 0);
      yaw = 0;
      pitch = 0;
      camera.rotation.set(0, 0, 0);
    }

    function triggerGameOver() {
      isGameOver = true;
      isLocked = false;
      if (!isTouchDevice) document.exitPointerLock();

      document.getElementById('titleText').innerText = "ELIMINATED!";
      document.getElementById('descText').innerText = `You fought bravely! Final Score: ${score}`;
      startBtn.innerText = "PLAY AGAIN";
      blocker.style.display = 'flex';
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);
      prevTime = time;

      if (isLocked && !isGameOver) {
        // --- MOVEMENT MATH ---
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
        const moveSpeed = 9.0 * delta;

        // Keyboard Movement (WASD: A = Left, D = Right)
        if (moveForward) camera.position.addScaledVector(forward, moveSpeed);
        if (moveBackward) camera.position.addScaledVector(forward, -moveSpeed);
        if (moveLeft) camera.position.addScaledVector(right, -moveSpeed);
        if (moveRight) camera.position.addScaledVector(right, moveSpeed);

        // Mobile Joystick Movement
        if (joystickActive) {
          camera.position.addScaledVector(forward, joystickVector.y * moveSpeed);
          camera.position.addScaledVector(right, joystickVector.x * moveSpeed);
        }

        // Keep player in bounds
        camera.position.x = Math.max(-75, Math.min(75, camera.position.x));
        camera.position.z = Math.max(-75, Math.min(75, camera.position.z));

        // --- BULLET HIT LOGIC ---
        for (let i = bullets.length - 1; i >= 0; i--) {
          let b = bullets[i];
          b.position.addScaledVector(b.userData.dir, 1.8);
          b.userData.life--;

          for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (b.position.distanceTo(e.position) < 1.3) {
              // Deduct EXACTLY 1 HP per bullet
              e.userData.hp -= 1;
              triggerHitFeedback();
              createHitParticles(b.position);

              // Flash Enemy White on Hit
              e.userData.bodyMesh.material.color.setHex(0xffffff);
              e.userData.flashTimer = 5;

              scene.remove(b);
              bullets.splice(i, 1);

              // Eliminate Enemy ONLY when 7 Hits are completed (hp <= 0)
              if (e.userData.hp <= 0) {
                scene.remove(e);
                enemies.splice(j, 1);
                score += 10;
                scoreVal.innerText = score;
              }
              break;
            }
          }

          if (b.userData.life <= 0 && bullets[i]) {
            scene.remove(b);
            bullets.splice(i, 1);
          }
        }

        // --- PARTICLE UPDATES ---
        for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.position.addScaledVector(p.userData.vel, delta);
          p.userData.life--;
          if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
          }
        }

        // --- ENEMY AI & FLASH ANIMATION ---
        enemies.forEach(e => {
          // Restore original color after flash
          if (e.userData.flashTimer > 0) {
            e.userData.flashTimer--;
            if (e.userData.flashTimer <= 0) {
              e.userData.bodyMesh.material.color.setHex(0xff0055);
            }
          }

          const enemyDir = new THREE.Vector3().subVectors(camera.position, e.position);
          enemyDir.y = 0;
          enemyDir.normalize();

          e.position.addScaledVector(enemyDir, 3.0 * delta);
          e.lookAt(camera.position.x, e.position.y, camera.position.z);

          // Damage player when close
          if (e.position.distanceTo(camera.position) < 1.5) {
            health -= 18 * delta;
            healthFill.style.width = `${Math.max(0, health)}%`;

            if (health <= 0) {
              triggerGameOver();
            }
          }
        });
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
    animate();
  </script>
</body>
</html>
